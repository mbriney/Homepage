<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theodore Roosevelt Presidential Library — 2024 Annual Report</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #1a1815;
      --ink: #fff;
      --muted: rgba(255,255,255,.65);
      --accent: #c89a3a;
    }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
      overflow: hidden;
    }
    .wrap {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100%;
      gap: .5rem;
      padding: .6rem .75rem;
      box-sizing: border-box;
    }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .85rem; color: var(--muted);
      padding: 0 .25rem;
    }
    .top strong { color: var(--ink); font-weight: 600; letter-spacing:.02em; }
    .top-right { display: flex; align-items: center; gap: 1rem; }
    .stage {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      min-height: 0;
      overflow: hidden;
    }
    #book {
      display: block;
      /* Force the book wrapper to sit centered; StPageFlip computes
         its own dimensions and we just need it to not break flex. */
    }
    .controls {
      display: flex; justify-content: center; align-items: center; gap: .75rem;
      font-size: .9rem; color: var(--muted);
    }
    .btn {
      background: rgba(255,255,255,.07);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      padding: .42rem .85rem;
      font: inherit; cursor: pointer;
      transition: background .15s, border-color .15s;
      display: inline-flex; align-items: center; gap: .35rem;
    }
    .btn:hover { background: rgba(255,255,255,.14); border-color: var(--accent); }
    .btn[disabled] { opacity:.35; cursor: default; }
    .btn svg { width: 16px; height: 16px; flex: 0 0 16px; }
    .pageinfo {
      min-width: 5ch; text-align: center; color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: .9rem;
    }
    a.download {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .15s;
    }
    a.download:hover { border-color: var(--accent); }
    /* Fullscreen tweaks — give the book the whole stage when expanded */
    :fullscreen .wrap { padding: 1rem 1.5rem; }
    :fullscreen .top, :fullscreen .controls { font-size: 1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <span><strong>TRPL · 2024 Annual Report</strong> · in the arena</span>
      <span class="top-right">
        <button id="fs" class="btn" type="button" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/></svg>
          <span id="fs-label">Fullscreen</span>
        </button>
        <a class="download" href="/files/trpl-annual-report/trpl-annual-report-2024.pdf" target="_blank" rel="noopener">Download PDF ↓</a>
      </span>
    </div>
    <div class="stage" id="stage">
      <div id="book"></div>
      <div id="loading" class="loading">Loading the book…</div>
    </div>
    <div class="controls">
      <button id="prev" class="btn" type="button" aria-label="Previous page">← Prev</button>
      <span class="pageinfo" id="pageinfo">— / 41</span>
      <button id="next" class="btn" type="button" aria-label="Next page">Next →</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    (function () {
      var TOTAL = 41;
      var stage = document.getElementById('stage');
      var bookEl = document.getElementById('book');
      var prev = document.getElementById('prev');
      var next = document.getElementById('next');
      var info = document.getElementById('pageinfo');
      var loading = document.getElementById('loading');
      var fsBtn = document.getElementById('fs');
      var fsLabel = document.getElementById('fs-label');
      var wrapEl = document.querySelector('.wrap');

      // 8.5x11 letter — page aspect h/w
      var PAGE_ASPECT = 11 / 8.5;

      function sizeForViewport() {
        var rect = stage.getBoundingClientRect();
        // Pad so the book never touches the controls/header
        var maxW = Math.max(280, rect.width  - 8);
        var maxH = Math.max(280, rect.height - 8);
        var spread = window.matchMedia('(min-width: 760px)').matches;
        if (spread) {
          // Two-page spread: total width = 2 × pageW; height = pageW × ASPECT
          // Find the largest pageW that fits inside (maxW, maxH).
          var byWidth  = maxW / 2;
          var byHeight = maxH / PAGE_ASPECT;
          var pageW = Math.floor(Math.min(byWidth, byHeight));
          return { pageW: pageW, pageH: Math.floor(pageW * PAGE_ASPECT), spread: true };
        }
        // Single-page (mobile)
        var pw = Math.floor(Math.min(maxW, maxH / PAGE_ASPECT));
        return { pageW: pw, pageH: Math.floor(pw * PAGE_ASPECT), spread: false };
      }

      var pageFlip = null;

      function init(targetPage) {
        var dims = sizeForViewport();
        bookEl.innerHTML = '';
        pageFlip = new St.PageFlip(bookEl, {
          width: dims.pageW,
          height: dims.pageH,
          size: 'fixed',
          drawShadow: true,
          showCover: true,
          mobileScrollSupport: true,
          usePortrait: !dims.spread,
          flippingTime: 700,
          maxShadowOpacity: 0.5,
          autoSize: false
        });

        var pages = [];
        for (var i = 1; i <= TOTAL; i++) {
          var n = i < 10 ? '0' + i : '' + i;
          pages.push('/files/trpl-annual-report/pages/page-' + n + '.jpg');
        }
        pageFlip.loadFromImages(pages);
        loading.style.display = 'none';

        pageFlip.on('flip', function (e) { setInfo(e.data); });
        pageFlip.on('init', function (e) { setInfo(e.data.page); });
        if (typeof targetPage === 'number' && targetPage > 0) {
          setTimeout(function () { try { pageFlip.turnToPage(targetPage); } catch (_) {} }, 50);
        }
        setInfo(0);
      }

      function setInfo(zeroIdx) {
        var human = Math.min(TOTAL, Math.max(1, zeroIdx + 1));
        info.textContent = human + ' / ' + TOTAL;
        prev.disabled = (zeroIdx <= 0);
        next.disabled = (zeroIdx >= TOTAL - 1);
      }

      prev.addEventListener('click', function () { if (pageFlip) pageFlip.flipPrev(); });
      next.addEventListener('click', function () { if (pageFlip) pageFlip.flipNext(); });
      document.addEventListener('keydown', function (e) {
        if (!pageFlip) return;
        if (e.key === 'ArrowLeft')  pageFlip.flipPrev();
        if (e.key === 'ArrowRight') pageFlip.flipNext();
      });

      // Fullscreen
      function toggleFs() {
        var doc = document;
        var el  = doc.documentElement;
        var inFs = !!(doc.fullscreenElement || doc.webkitFullscreenElement);
        if (!inFs) {
          (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        } else {
          (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
        }
      }
      fsBtn.addEventListener('click', toggleFs);
      document.addEventListener('fullscreenchange', onFsChange);
      document.addEventListener('webkitfullscreenchange', onFsChange);
      function onFsChange() {
        var inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        fsLabel.textContent = inFs ? 'Exit fullscreen' : 'Fullscreen';
        // Re-init at the larger size; preserve current page
        scheduleReinit();
      }

      // Debounced re-init on resize / fullscreen
      var resizeTimer;
      function scheduleReinit() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          if (!pageFlip) return init();
          var cur = pageFlip.getCurrentPageIndex();
          init(cur);
        }, 120);
      }
      window.addEventListener('resize', scheduleReinit);
      window.addEventListener('orientationchange', scheduleReinit);

      // Boot
      if (window.St && window.St.PageFlip) {
        init();
      } else {
        var tries = 0;
        var t = setInterval(function () {
          tries++;
          if (window.St && window.St.PageFlip) { clearInterval(t); init(); }
          else if (tries > 40) {
            clearInterval(t);
            loading.textContent = 'Could not load the page-flip library.';
          }
        }, 100);
      }
    })();
  </script>
</body>
</html>
