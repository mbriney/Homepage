<!-- Google tag (gtag.js). Loaded lazily — gtag.js is ~70KB of mostly-unused
     JavaScript and a third-party connection, neither of which should compete
     with first paint. We attach it on first interaction, or after the page has
     been idle for 3s, whichever comes first. Analytics still records the
     pageview; it just stops taxing the critical path. -->
<script>
  (function () {
    var loaded = false;
    function loadGA() {
      if (loaded) return; loaded = true;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-0RQJ767Q41';
      document.head.appendChild(s);
    }
    ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (e) {
      window.addEventListener(e, loadGA, { once: true, passive: true });
    });
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadGA, { timeout: 3000 });
    } else { setTimeout(loadGA, 3000); }
  })();
</script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // Derive content_group from URL so GA4 reports split by career chapter
  var __cg = (function(p){
    if (p === '/' || p === '/index.html') return 'Home';
    if (p.indexOf('/bio') === 0) return 'Bio';
    if (p.indexOf('/cv')  === 0) return 'CV';
    var m = p.match(/^\/projects\/([^/]+)\//);
    if (!m) return 'Other';
    var slug = m[1];
    var GROUPS = {
      'Mount Vernon': ['mount-vernon-website','tessitura-ticketing','mount-vernon-virtual-tour','be-washington','washingtons-war-4d','orientation-film','ar-tour','numismatic-kiosk','audio-tour','short-films','magazine','covid-response','mv-explorer','agent-711','campaign-mount-vernon','democracy-symposium'],
      'TRPL':         ['trpl-reading-room','google-grants-optimizer','trpl-grand-opening-media','trpl-opening-weekend','trpl-potus-visit','trpl-labs','trpl-drip-campaign','trpl-launch-campaign','trpl-trailblazer'],
      'Edelman':      ['multiplier'],
      'Emotive':      ['mlk-memorial','pickens-plan'],
      'Personal':     ['travel-passport','family-tree']
    };
    for (var k in GROUPS) if (GROUPS[k].indexOf(slug) !== -1) return k;
    return 'Projects';
  })(location.pathname);

  gtag('config', 'G-0RQJ767Q41', { content_group: __cg });
</script>
